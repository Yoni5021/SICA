name: SICA EXTERNAL iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - sica-external-reconstruction

permissions:
  contents: read

concurrency:
  group: sica-ios-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS archive
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build device archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SICA-EXTERNAL.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Package unsigned IPA for inspection
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SICA-EXTERNAL.xcarchive/Products/Applications/3105.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/3105.app"
          (cd "$RUNNER_TEMP/ipa" && ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/SICA-EXTERNAL-unsigned.ipa")
          echo "Created an unsigned IPA container. It is not installable until signed."

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sica-external-ios-unsigned-build
          path: |
            \${{ runner.temp }}/SICA-EXTERNAL.xcarchive
            \${{ runner.temp }}/SICA-EXTERNAL-unsigned.ipa
            \${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: warn
          retention-days: 14
